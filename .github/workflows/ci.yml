name: QA Suite

# The pipeline shape that matters more than any single tool choice:
#
#   push / PR  ->  lint  ->  services (fast)  ->  web + mobile-web (parallel)  ->  report
#   nightly    ->  the above + real devices + long property-based runs
#
# Fast layers gate slow ones. There is no point spending eight minutes on
# browsers when a 40-second API run already proved the build is broken.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"        # nightly, 02:00 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [local, dev, stage]
        default: local

concurrency:
  # A new push makes the in-flight run obsolete. Cancelling saves runner minutes
  # and stops stale red X's from confusing reviewers.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QA_ENV: ${{ inputs.environment || 'local' }}
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[lint]"
      - run: ruff check framework tests sut conftest.py tools
      - run: ruff format --check framework tests sut conftest.py tools
      - name: Type-check the framework
        # The framework is library code that tests depend on; it earns stricter
        # checking than the tests themselves.
        run: mypy framework

  services:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Run API tests
        run: pytest tests/services -n auto --alluredir=allure-results --junitxml=junit-services.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-services
          path: allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-services, path: junit-services.xml }

  web:
    needs: services            # don't burn browser minutes on a broken API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false         # one browser failing must not hide the others
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: Run web + emulated mobile-web tests
        run: |
          pytest tests/web \
            --browser=${{ matrix.browser }} \
            --video=retain-on-failure --output=artifacts \
            -n auto \
            --reruns 1 --reruns-delay 2 \
            --alluredir=allure-results \
            --junitxml=junit-web-${{ matrix.browser }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-web-${{ matrix.browser }}
          path: allure-results
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts-${{ matrix.browser }}
          path: |
            artifacts/**/*.png
            artifacts/**/*.webm
            artifacts/sut.log
          retention-days: 7

  build-mobile-app:
    # The real "build" stage of the mobile pipeline: compile the app this
    # course tests from ITS OWN source, rather than only ever installing the
    # binary already committed at apps/mda-2.2.0-25.apk. Nightly/on-demand
    # only, same reasoning as the `mobile` job below.
    #
    # Pinned to the exact commit tagged 2.2.0 upstream — the tag that produced
    # the release asset literally named mda-2.2.0-25.apk, i.e. the same build
    # apps/README.md documents and every locator in
    # framework/mobile/screens.py was verified against. Building from that
    # repo's default branch instead would let upstream silently change the
    # app (and break every locator here) with no warning and no diff in this
    # repository to review.
    #
    # JDK 11 + android-actions/setup-android@v3 + `app:assembleDebug` mirror
    # that repo's own working release workflow
    # (.github/workflows/publish-on-release.yml as of this commit) rather
    # than a guessed toolchain — an old (2021-era) Gradle/AGP combination that
    # is proven to build, not assumed to.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the upstream app source at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: saucelabs/my-demo-app-android
          ref: 36b012eecdf6a2b488b9504e16b3d0c3ca9a0e7b
          path: my-demo-app-android
      # Two JDKs, deliberately, for two different consumers with two different
      # floors — both discovered by running the previous version of this job
      # and reading the exact error, not assumed up front:
      #   - sdkmanager itself (whichever cmdline-tools revision — even the one
      #     already preinstalled on the runner) is a JDK 17+ binary: JDK 11
      #     first failed it with "This tool requires JDK 17 or later", and
      #     switching to the preinstalled sdkmanager instead of downloading a
      #     newer one still failed with UnsupportedClassVersionError (class
      #     file version 61 vs. the JDK 11 runtime's 55) — the SAME floor,
      #     just a less friendly error message.
      #   - Gradle 7.2 / AGP 7.0.2, the toolchain this 2021-era project
      #     actually builds with, needs JDK 11 — that's what its own working
      #     publish-on-release.yml uses, and Gradle 7.2 does not support
      #     JDK 17 as the daemon's own runtime.
      # actions/setup-java installs every listed version and exposes each as
      # JAVA_HOME_<major>_X64, so each command below picks the JDK it needs
      # rather than fighting over one shared JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            11
      # NOT android-actions/setup-android: its default cmdline-tools download
      # is the same JDK-17-only binary as the preinstalled one, and the
      # runner's own Android SDK at ANDROID_HOME already has everything except
      # the specific old platform/build-tools versions this project pins.
      - name: Install the platform/build-tools versions this project pins
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-31" "build-tools;30.0.2"
      - name: Compile a fresh debug apk from source
        working-directory: my-demo-app-android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: ./gradlew app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: freshly-built-apk
          path: my-demo-app-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  mobile:
    # Real devices are slow and cost money — nightly and on demand only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [services, build-mobile-app]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Appium 3 and drivers
        # NOT appium@next: on npm's own registry that dist-tag currently
        # resolves to 2.0.1, an OLDER release than `latest` (3.6.0) — `next`
        # is not the bleeding edge for this particular package. Installing it
        # pulled in Appium 2.x underneath a uiautomator2 driver build (8.4.0)
        # that expects Appium 3's package layout, which broke Node's module
        # resolution: "Cannot find package 'appium' imported from
        # .../appium-android-driver/build/lib/driver.js" — every mobile test
        # errored at driver setup with no test-level failure to point at.
        # Confirmed by checking https://registry.npmjs.org/appium's
        # dist-tags directly rather than assuming what `next` means here.
        # `@3`, not `@latest`: this course's docs and framework are written
        # against Appium 3's capability/driver model specifically — pin the
        # major version so a future Appium 4 can't silently break this job
        # the same way `next` unexpectedly did.
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version

      # This is the "deploy" half of build -> deploy -> test -> gate: the
      # artifact build-mobile-app just compiled, not the binary committed to
      # apps/, is what gets installed onto the emulator and tested below.
      - uses: actions/download-artifact@v4
        with:
          name: freshly-built-apk
          path: apps/ci-build

      - name: Run Android tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # reactivecircus/android-emulator-runner executes each line of
          # `script` as its own separate `sh -c` call — not as one continuous
          # multi-line script — so a `\` line continuation across lines
          # silently does not work here the way it would in a normal `run:`
          # step. A live run confirmed this the hard way: the emulator booted,
          # Appium started, wait-on succeeded, and then this exact line split
          # across two lines with a trailing backslash failed with
          # `sh: 1: \: not found`, after which the action hung until the
          # job's own 45-minute timeout force-cancelled it rather than
          # failing fast. Every command below is one unbroken physical line.
          script: |
            appium --log appium.log &
            npx wait-on http://127.0.0.1:4723/status -t 60000
            QA_APP_PATH=apps/ci-build/app-debug.apk pytest tests/mobile -m "smoke or mobile_web" --alluredir=allure-results --junitxml=junit-mobile.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-mobile
          path: |
            allure-results
            appium.log

  report:
    needs: [services, web]
    if: always()
    runs-on: ubuntu-latest
    # The default token is read-only. Publishing the report needs to push the
    # gh-pages branch, and annotating the pull request needs to write checks.
    # Granting these per-job rather than workflow-wide keeps the test jobs —
    # the ones that run third-party test code — on a read-only token.
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: allure-*, path: all-results, merge-multiple: true }

      - name: Restore Allure history
        # Without history, every report is a snapshot. With it, you get trends:
        # flaky-test detection, duration drift, pass-rate over time. This is the
        # step teams forget, and it is what makes the report worth opening.
        uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: gh-pages, path: gh-pages }
      - run: |
          mkdir -p all-results
          cp -r gh-pages/last-history all-results/history 2>/dev/null || true

      - uses: simple-elf/allure-report-action@master
        with:
          allure_results: all-results
          allure_history: allure-history
          keep_reports: 30

      # simple-elf/allure-report-action runs in a Docker container, which writes
      # allure-history as root. The next step (running as the normal runner
      # user) cannot fully delete a root-owned .git left inside it — the delete
      # partially fails, a stale HEAD pointing at a stray "master" branch
      # survives the copy, and the commit silently lands on the wrong branch.
      # Symptom: "git push origin gh-pages" fails with "src refspec gh-pages
      # does not match any", even though the orphan checkout and commit steps
      # both reported success. Strip any nested git repo before it can happen.
      - name: Remove any root-owned .git left by the report generator
        run: sudo rm -rf allure-history/.git

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Publish the test summary on the PR
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/junit-*.xml"
          check_name: Test results
