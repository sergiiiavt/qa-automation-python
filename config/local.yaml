# Lowest-priority config layer for QA_ENV=local. Env vars override anything here.
api:
  base_url: http://127.0.0.1:8000
  timeout: 10
  retries: 2

web:
  base_url: http://127.0.0.1:8000
  headless: true
  action_timeout_ms: 10000

mobile:
  appium_url: http://127.0.0.1:4723
  platform: android
  device_name: Pixel_7_API_34
  # Deliberately not pinned here — see MobileSettings.platform_version in
  # framework/config.py for why a fixed OS version is a hard Appium filter,
  # not a hint, and breaks the moment a dev's AVD is on a different image.

user:
  name: alice
  password: wonderland
